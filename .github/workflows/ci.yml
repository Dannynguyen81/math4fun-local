name: Verify Math4Fun

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Public client configuration only. Never add SUPABASE_SERVICE_ROLE_KEY here.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Production build
        run: pnpm build
